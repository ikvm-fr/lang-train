# Build and publish to the gh-pages branch:
#   main            → https://<owner>.github.io/<repo>/
#   any branch      → https://<owner>.github.io/<repo>/preview/<branch>/
#   branch deleted  → its preview is removed
# Repository settings: Settings → Pages → Deploy from a branch → gh-pages / (root).
name: Pages

on:
  push:
    branches: ['**']
  delete:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref_name != 'gh-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve target path
        id: target
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}" ]; then
            echo "dir=" >> "$GITHUB_OUTPUT"
            echo "base=/$repo/" >> "$GITHUB_OUTPUT"
          else
            slug=$(echo "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
            echo "dir=preview/$slug" >> "$GITHUB_OUTPUT"
            echo "base=/$repo/preview/$slug/" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.target.outputs.base }}

      - name: Publish to gh-pages
        env:
          DIR: ${{ steps.target.outputs.dir }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "$url" site
          else
            git init -b gh-pages site
            git -C site remote add origin "$url"
          fi
          if [ -z "$DIR" ]; then
            # main: replace everything except branch previews
            find site -mindepth 1 -maxdepth 1 ! -name .git ! -name preview -exec rm -rf {} +
            cp -r dist/. site/
          else
            rm -rf "site/$DIR"
            mkdir -p "site/$DIR"
            cp -r dist/. "site/$DIR/"
          fi
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_REF_NAME}@${GITHUB_SHA::7}" || { echo "no changes"; exit 0; }
          git push origin gh-pages
          owner="${GITHUB_REPOSITORY%%/*}"
          echo "### https://${owner}.github.io/${GITHUB_REPOSITORY#*/}/${DIR:+$DIR/}" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Remove branch preview
        env:
          BRANCH: ${{ github.event.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git ls-remote --exit-code --heads "$url" gh-pages >/dev/null || exit 0
          git clone --depth 1 --branch gh-pages "$url" site
          slug=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          [ -d "site/preview/$slug" ] || exit 0
          cd site
          git rm -rq "preview/$slug"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "remove preview $slug"
          git push origin gh-pages
